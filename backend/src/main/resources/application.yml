server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: sigaps-backend

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/sigaps_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${MYSQLUSER:sigaps_user}
    password: ${MYSQLPASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway (db/migration). Hibernate NO gestiona el DDL.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Lima
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Adopta Flyway sobre la BD ya creada manualmente con db/schema.sql (V1) sin
    # volver a ejecutarlo; en una BD nueva y vacía esto no tiene efecto y V1 sí corre.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Esquema inicial (db/schema.sql)"

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

sigaps:
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-en-produccion-minimo-64-caracteres-aleatorios-1234567890}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:28800000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    pe.sigaps: INFO
    org.springframework.security: WARN
